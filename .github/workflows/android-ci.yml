name: Android port CI

on:
  push:
    branches:
      - android-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Compile and test
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Save test APK
        uses: actions/upload-artifact@v7
        with:
          name: sito-android-development-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
