name: Android port CI

on:
  push:
    branches:
      - android-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Compile and test
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Save test APK
        uses: actions/upload-artifact@v7
        with:
          name: sito-android-development-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  device-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Enable hardware-accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle -p android :app:connectedDebugAndroidTest --no-daemon

  publish-preview:
    needs: [build, device-smoke]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish Android preview')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sito-android-development-apk
          path: output
      - name: Publish tested Android APK beside the iOS IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: nikolaign/sito-ios
        shell: bash
        run: |
          cp output/app-debug.apk SITO-0.9.4-android-preview.apk
          unzip -tq SITO-0.9.4-android-preview.apk
          sha256sum SITO-0.9.4-android-preview.apk
          gh release upload v0.9.4 SITO-0.9.4-android-preview.apk --clobber
          existing="$(gh release view v0.9.4 --json body --jq .body)"
          printf '%s\n\nAndroid preview: install SITO-0.9.4-android-preview.apk on Android 8.0+. This is a debug-signed test package, not a Play Store release; switching build signatures requires uninstalling the old preview before installing a new one.\n' "$existing" | gh release edit v0.9.4 --notes-file -
