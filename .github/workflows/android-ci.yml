name: Android port CI

on:
  push:
    branches:
      - android-port
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Compile and test
        run: gradle -p android :app:assembleDebug :app:testDebugUnitTest --no-daemon
      - name: Save test APK
        uses: actions/upload-artifact@v7
        with:
          name: sito-android-development-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  device-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Enable hardware-accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle -p android :app:connectedDebugAndroidTest --no-daemon

  publish-release:
    needs: [build, device-smoke]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Publish SITO v0.9.5')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Build matching iOS IPA
        run: ./build-ipa.command
      - uses: actions/download-artifact@v8
        with:
          name: sito-android-development-apk
          path: output
      - name: Publish tested APK and unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: nikolaign/sito-ios
        shell: bash
        run: |
          cp output/app-debug.apk SITO-0.9.5-android-preview.apk
          unzip -tq SITO-0.9.5-android-preview.apk
          unzip -tq build/SITO-0.9.5-unsigned.ipa
          shasum -a 256 SITO-0.9.5-android-preview.apk build/SITO-0.9.5-unsigned.ipa
          if gh release view v0.9.5 >/dev/null 2>&1; then
            gh release upload v0.9.5 SITO-0.9.5-android-preview.apk build/SITO-0.9.5-unsigned.ipa --clobber
          else
            gh release create v0.9.5 SITO-0.9.5-android-preview.apk build/SITO-0.9.5-unsigned.ipa \
              --target "$GITHUB_SHA" --title 'SITO v0.9.5' \
              --notes 'A quieter Archive & Backup screen, six working RSS collections, clearer Serbia/World source placement and refined gate puzzles on iOS and Android. Both packages passed compilation; Android was also tested on API 26 and 35 emulators. The iOS IPA is unsigned for compatible sideloading setups. The Android APK is debug-signed: its signature may differ from the earlier preview. Export an encrypted backup and keep your recovery key before uninstalling an older Android build. Never uninstall before preserving your data.'
          fi
