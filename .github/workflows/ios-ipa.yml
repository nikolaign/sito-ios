name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          app_version="$(sed -n 's/^APP_VERSION="\([^"]*\)"$/\1/p' build-ipa.command)"
          if [[ "$GITHUB_REF_NAME" != "v$app_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $app_version"
            exit 1
          fi

      - name: Build unsigned IPA
        run: ./build-ipa.command

      - name: Verify IPA
        shell: bash
        run: |
          ipa="$(find build -maxdepth 1 -name 'SITO-*-unsigned.ipa' -type f -print -quit)"
          test -n "$ipa"
          unzip -tq "$ipa"
          unzip -p "$ipa" Payload/Sito.app/Info.plist >/dev/null
          shasum -a 256 "$ipa"
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Save IPA as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: sito-unsigned-ipa
          path: build/SITO-*-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$IPA_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$IPA_PATH" \
              --title "SITO $GITHUB_REF_NAME" \
              --notes "Unsigned iOS IPA for compatible sideloading setups such as LiveContainer. This is not an App Store-signed build." \
              --verify-tag
          fi
